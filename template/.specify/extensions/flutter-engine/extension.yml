schema_version: "1.0"

extension:
  id: flutter-engine
  name: "Flutter Engine"
  version: "2.1.0"
  description: "Spec-driven Flutter delivery workflows for Codex"
  author: "INNOVA DIGITS"
  repository: "https://github.com/AdelMohsen/flutter-workflow"

requires:
  speckit_version: ">=0.9.0"

provides:
  commands:
    - name: speckit.flutter-engine.run
      file: commands/run.md
      description: "Dispatch a Flutter Engine chat flow"
    - name: speckit.flutter-engine.prepare
      file: commands/prepare.md
      description: "Discover, specify, and plan a mutating Flutter Engine flow"
    - name: speckit.flutter-engine.apply
      file: commands/apply.md
      description: "Apply and verify an approved Flutter Engine plan"
    - name: speckit.flutter-engine.operate
      file: commands/operate.md
      description: "Run a read-only or bootstrap Flutter Engine operation"

tags: [flutter, codex, sdd, chat, security, testing]
